name: GrubIOS
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"
options:
  bundleIdPrefix: com.jessedev
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "5.9"
targets:
  GrubIOS:
    type: application
    platform: iOS
    sources:
      - GrubIOS
    dependencies:
      - package: GoogleMobileAds
    settings:
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
      INFOPLIST_KEY_UIRequiresFullScreen: true
      INFOPLIST_KEY_UIStatusBarHidden: true
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      PRODUCT_BUNDLE_IDENTIFIER: com.jessedev.GrubIOS
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: true
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 2JME4EQ8MT
    info:
      path: GrubIOS/Info.plist
      properties:
        UIAppFonts:
          - PressStart2P-Regular.ttf
        GADApplicationIdentifier: ca-app-pub-2693240777289599~6001078046
        NSUserTrackingUsageDescription: "Grub uses ads to stay free. Allow tracking for more relevant ads."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
  GrubIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GrubIOSTests
    dependencies:
      - target: GrubIOS
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GrubIOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GrubIOS"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GrubIOS:
    build:
      targets:
        GrubIOS: all
        GrubIOSTests: [test]
    test:
      targets:
        - GrubIOSTests
    run:
      config: Debug
